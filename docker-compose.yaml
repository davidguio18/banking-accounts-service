services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-accounts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-accounts}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  banking-accounts-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      DB_URL: "${DB_URL:-jdbc:postgresql://host.docker.internal:5432/banking_accounts_db}"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-accounts}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-accounts}
      CUSTOMERS_SERVICE_URL: ${CUSTOMERS_SERVICE_URL:-http://host.docker.internal:8081/api}
    ports:
      - "${SERVER_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
